version: '3.8'
services:
  mysql-db:
    image: mysql:8.0
    container_name: mysql-container
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: hotel
    ports:
      - "3307:3306"
    volumes:
      - db_data:/var/lib/mysql
  hotel:
    build:
      context: .
    container_name: hotel-container
    ports:
      - "8003:8002"
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql-db:3306/hotel
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: root
    depends_on:
      - mysql-db
volumes:
  db_data:
